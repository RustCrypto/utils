[package]
name = "zeroize_allocator"
version = "0.1.0"
authors = ["The RustCrypto Project Developers"]
edition = "2024"
rust-version = "1.100"
documentation = "https://docs.rs/zeroize_allocator"
repository = "https://github.com/RustCrypto/utils"
license = "Apache-2.0 OR MIT"
keywords = ["memory", "memset", "secure", "volatile", "zero"]
categories = ["cryptography", "memory-management", "no-std", "os"]
description = """
A wrapping allocator that uses zeroization functions to zeroize memory upon deallocation.
"""

[dependencies]
zeroize = "1.9"

[lints]
workspace = true
